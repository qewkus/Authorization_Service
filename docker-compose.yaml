services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
    ports:
      - 8001:8000
    environment:
      - DOCKER_ENV=1
    depends_on:
      - db
      - redis


  redis:
    image: redis:latest
    expose:
      - "6379"

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.docker


volumes:
  static_volume:
  postgres_data: